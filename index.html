<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基金投资报告 - 2026-09-15</title>
<style>
:root {
  --bg: #faf8f3;        /* 米色背景 */
  --fg: #2c2c2c;
  --primary: #5a7a5e;  /* 莫兰迪绿 */
  --accent: #6b8e9e;   /* 莫兰迪蓝 */
  --warn: #c9744a;     /* 暖橙 */
  --good: #5a7a5e;
  --bad: #b6584a;
  --border: #e0dcd0;
  --bg-card: #fffef9;
  --shadow: rgba(0,0,0,0.04);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  padding: 0;
}

/* Tab 切换 */
.tabs {
  display: flex;
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  gap: 8px;
  overflow-x: auto;
}

.tab {
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--fg);
  font-size: 15px;
  font-weight: 500;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
}

.tab.active {
  background: var(--primary);
  color: white;
}

.tab-content {
  display: none;
  padding: 16px;
  max-width: 1200px;
  margin: 0 auto;
}

.tab-content.active { display: block; }

/* 头部 */
.header {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px var(--shadow);
}

.header h1 {
  font-size: 22px;
  color: var(--primary);
  margin-bottom: 8px;
}

.header .meta {
  font-size: 13px;
  color: #777;
}

/* 卡片 */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px var(--shadow);
}

.card h2 {
  font-size: 18px;
  color: var(--primary);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* 表格 */
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th {
  background: var(--primary);
  color: white;
  padding: 10px 8px;
  text-align: left;
  font-weight: 500;
  white-space: nowrap;
}

td {
  padding: 8px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

tr:nth-child(even) { background: #f7f5ed; }

/* 颜色标记 */
.warn { color: var(--warn); font-weight: 500; }
.good { color: var(--good); font-weight: 500; }
.bad { color: var(--bad); font-weight: 500; }
.danger { color: #cc3344; font-weight: 600; }

/* 操作建议 */
.action-good { background: #e8f5e9 !important; }
.action-bad { background: #ffe8e8 !important; }
.action-watch { background: #fff8e1 !important; }

/* 引述块 */
.quote {
  background: #f0ebe1;
  border-left: 4px solid var(--primary);
  padding: 10px 14px;
  margin: 10px 0;
  border-radius: 6px;
  font-style: italic;
  color: #555;
  font-size: 13px;
}

/* 小屏适配 */
@media (max-width: 600px) {
  body { font-size: 14px; }
  .card { padding: 14px; }
  .tab { padding: 8px 14px; font-size: 14px; }
  table { font-size: 13px; }
  th, td { padding: 6px 6px; }
}

/* 隐藏的 markdown 原始元素 */
h1, h2, h3, h4, h5, h6 {
  font-weight: 600;
  margin: 0;
}
ul, ol { padding-left: 20px; margin: 6px 0; }
li { margin: 2px 0; }
strong { font-weight: 600; }
hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
p { margin: 6px 0; }

.score-good { color: var(--good); }
.score-watch { color: var(--warn); }
.score-bad { color: var(--bad); }
.score-danger { color: #cc3344; font-weight: 700; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" onclick="showTab('daily')">📊 日报</button>
  <button class="tab" onclick="showTab('weekly')">📅 周报</button>
  <button class="tab" onclick="showTab('monthly')">📋 月报</button>
</div>

<div id="daily" class="tab-content active">
  
</div>

<div id="weekly" class="tab-content">
  
</div>

<div id="monthly" class="tab-content">
  
</div>

<div class="header" style="margin: 16px; text-align: center; font-size: 12px; color: #999;">
  💡 基金投资报告 v2 · 由 Claude 智能分析 · 数据来源：AKShare + FRED · 仅供参考
</div>

<script>
function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  document.querySelectorAll('.tab')[['daily','weekly','monthly'].indexOf(name)].classList.add('active');
  window.scrollTo(0, 0);
}
</script>

</body>
</html>
